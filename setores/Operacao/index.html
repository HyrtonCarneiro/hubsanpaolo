<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação - San Paolo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <!-- Firebase Compat SDK (works on file:// protocol) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Tailwind Scripts for Local Setup -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandOrange: '#da5513',
                        brandRed: '#da0d17',
                        brandBlue: '#265d7c',
                        brandGreen: '#4f7039',
                        mainText: '#56331b',
                        mutedText: '#786d68',
                        surface: '#ffffff',
                        border: '#d1c8b4',
                        background: '#e8e1d0'
                    }
                }
            }
        }
                <h2 class="text-xl font-bold text-[var(--text-main)] m-0">Gerenciar Equipe</h2>
                <button class="w-8 h-8 flex items-center justify-center rounded-full text-[var(--text-muted)] hover:bg-black/10 dark:hover:bg-white/10 transition-colors" onclick="window.fecharModalEquipe()"><i class="ph ph-x"></i></button>
            </div>
            <div class="p-6">
                <div class="flex flex-col gap-1.5 mb-5">
                    <label class="text-[0.65rem] font-bold text-[var(--text-muted)] uppercase ml-1">Selecionar Usuário do Sistema</label>
                    <div class="flex gap-2">
                        <select id="novoMembroSelecionado" class="flex-1 px-4 py-2 bg-[var(--bg-color)] border-1.5 border-[var(--border)] rounded-lg text-[var(--text-main)] transition-colors focus:border-[var(--primary)] outline-none text-sm">
                            <option value="">Selecione um usuário...</option>
                        </select>
                        <button class="flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-[var(--primary)] text-white border border-[var(--primary)] font-semibold shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md hover:brightness-110" onclick="window.adicionarMembro()">Adicionar</button>
                    </div>
                </div>
                <div id="listaEquipeGerenciar" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </div>
    <script src="../../js/services/NotificationService.js"></script>
</body>

</html>
